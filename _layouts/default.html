<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | Victor R. Kebande</title>
  <style>
    body {
  max-width: 1100px;
  margin: 40px auto;
  padding: 0 24px;
  font-family: Arial, sans-serif;
  font-size: 18px;
  line-height: 1.7;
  color: #f2f2f2;
  background: #000000;
}

h1, h2, h3 {
  color: #79c753;
}

a {
  color: #79c753;
  text-decoration: none;
}

a:hover {
  color: #a5ee80;
  text-decoration: underline;
}

hr {
  border: 0;
  border-top: 1px solid #333333;
  margin: 28px 0;
}
    .site-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  padding-bottom: 24px;
  margin-bottom: 32px;
  border-bottom: 1px solid #333;
}

.site-name {
  font-size: 24px;
  font-weight: bold;
}

.site-header nav {
  display: flex;
  flex-wrap: wrap;
  gap: 24px;
}

.site-header nav a {
  font-size: 16px;
  font-weight: bold;
}
  </style>
</head>
<body>
  <header class="site-header">
  <a class="site-name" href="/">Victor R. Kebande</a>

  <nav aria-label="Main navigation">
    <a href="/#research-interests">Research</a>
    <a href="/#recent-publications">Publications</a>
    <a href="/#teaching">Teaching</a>
    <a href="/#contact">Contact</a>
  </nav>
</header>
  <main>
    {{ content }}
  </main>
</body>
</html>
